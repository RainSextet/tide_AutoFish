modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="icon.png"
description='''${mod_description}'''
# Purely client-side automation. Servers must not require the mod (or show a
# red X) when a client has it installed.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Tide's fishing hook entity and its networking are required. The mod refuses to
# load without Tide instead of silently doing nothing.
[[dependencies.${mod_id}]]
    modId="tide"
    mandatory=true
    versionRange="[2.1,)"
    ordering="AFTER"
    side="CLIENT"
